<!DOCTYPE html>
<html>
<head>
    <title>GitHub Profile Finder</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 65%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 18px;
            margin-left: 5px;
            border: none;
            border-radius: 5px;
            background: #24292e;
            color: white;
            cursor: pointer;
        }

        #profile {
            margin-top: 25px;
        }

        #profile img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
        }

        #name {
            font-size: 25px;
            font-weight: bold;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .stats div {
            font-weight: bold;
        }

        #profile a {
            display: inline-block;
            margin: 10px;
            padding: 10px 15px;
            background: #24292e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        #repositories {
            text-align: left;
            margin-top: 20px;
        }

        #repositories a {
            display: block;
            background: none;
            color: #0366d6;
            padding: 5px;
        }

        #error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>GitHub Profile Finder</h2>

        <input type="text" id="username" placeholder="Enter GitHub username">

        <button onclick="findProfile()">Search</button>

        <div id="profile"></div>

        <p id="error"></p>

    </div>

    <script>
        async function findProfile() {
            let username = document.getElementById("username").value.trim();

            if (username == "") {
                document.getElementById("error").innerHTML =
                    "Please enter a username.";
                document.getElementById("profile").innerHTML = "";
                return;
            }

            document.getElementById("error").innerHTML = "Loading...";

            try {
                let response = await fetch(
                    "https://api.github.com/users/" + username
                );

                let data = await response.json();

                if (!response.ok) {
                    throw new Error("User not found");
                }

                document.getElementById("error").innerHTML = "";

                let repoResponse = await fetch(data.repos_url);
                let repos = await repoResponse.json();

                let repoList = "";

                repos.slice(0, 5).forEach(function(repo) {
                    repoList +=
                        "<a href='" +
                        repo.html_url +
                        "' target='_blank'>" +
                        repo.name +
                        "</a>";
                });

                document.getElementById("profile").innerHTML =
                    "<img src='" + data.avatar_url + "'>" +

                    "<p id='name'>" +
                    data.name +
                    "</p>" +

                    "<p>@" +
                    data.login +
                    "</p>" +

                    "<p>" +
                    (data.bio || "No bio available") +
                    "</p>" +

                    "<div class='stats'>" +
                    "<div>Followers<br>" +
                    data.followers +
                    "</div>" +

                    "<div>Following<br>" +
                    data.following +
                    "</div>" +

                    "<div>Repositories<br>" +
                    data.public_repos +
                    "</div>" +
                    "</div>" +

                    "<a href='" +
                    data.html_url +
                    "' target='_blank'>View GitHub Profile</a>" +

                    "<div id='repositories'>" +
                    "<h3>Public Repositories</h3>" +
                    repoList +
                    "</div>";
            }
            catch (error) {
                document.getElementById("profile").innerHTML = "";

                document.getElementById("error").innerHTML =
                    "GitHub user not found.";
            }
        }
    </script>

</body>
</html>
